<!doctype html>
<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work Voice Pay Monthly</title>
<style>
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden;
    background: #fff;
    width: 100%;
  }
  #f {
    width: 700px;
    height: 2600px;
    border: 0;
    display: block;
    transform-origin: 0 0;
    will-change: transform;
    /* We start with 0 margin because we are scaling into the gap */
    margin: 0;
  }
</style>
<iframe id="f" src="https://pub.mailmodo.dev/p/1iXrJOS62s" title="Newsletter"></iframe>
<script>
  var q = new URLSearchParams(location.search),
      W = +q.get('w') || 700,
      H = +q.get('h') || 2600,
      P = q.get('p') || '1iXrJOS62s',
      f = document.getElementById('f');

  f.src = 'https://pub.mailmodo.dev/p/' + P;
  f.style.width = W + 'px';
  f.style.height = H + 'px';

  function fit(){
    // 1. Get the actual width of the iframe container
    var containerWidth = document.documentElement.clientWidth;

    // 2. Calculate the scale needed to fit the 700px content into the container
    var s = containerWidth / W;

    // 3. Apply the scale
    f.style.transform = 'scale(' + s + ')';
    document.body.style.height = (H * s) + 'px';

    /* 
       THE FIX: Since the iframe is offset by 20px by Umbraco, 
       we shift the content LEFT by exactly 20px * scale.
       This 'pulls' the content into that dead space.
    */
    f.style.position = 'relative';
    f.style.left = (-20 * s) + 'px';
  }
  new ResizeObserver(fit).observe(document.documentElement);
  fit();
</script>
</html>
