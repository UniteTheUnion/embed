<!doctype html>
<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work Voice Pay Monthly</title>
<style>
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden;
    background: #fff;
    /* Force the body to be slightly wider than the container 
       to accommodate the negative margins */
    width: calc(100% + 40px) !important;
    position: relative;
  }
  #f {
    width: 700px;
    height: 2600px;
    border: 0;
    display: block;
    transform-origin: 0 0;
    will-change: transform;
    /* Pull it hard to the left to override the 20px padding */
    margin-left: -20px !important; 
  }
</style>
<iframe id="f" src="https://pub.mailmodo.dev/p/1iXrJOS62s" title="Newsletter"></iframe>
<script>
  var q = new URLSearchParams(location.search),
      W = +q.get('w') || 700,
      H = +q.get('h') || 2600,
      P = q.get('p') || '1iXrJOS62s',
      f = document.getElementById('f');

  if (!/^[A-Za-z0-9]+$/.test(P || '')) throw new Error('bad id');
  f.src = 'https://pub.mailmodo.dev/p/' + P;
  f.style.width = W + 'px';
  f.style.height = H + 'px';

  function fit(){
    // We use window.innerWidth to get the true viewport width, 
    // ignoring the Umbraco padding.
    var s = Math.min(1, window.innerWidth / W);
    f.style.transform = 'scale(' + s + ')';
    document.body.style.height = (H * s) + 'px';

    // IMPORTANT: We must also scale the negative margin, 
    // otherwise the 'pull' is too strong on small screens.
    f.style.marginLeft = (-20 * s) + 'px';
  }
  new ResizeObserver(fit).observe(document.documentElement);
  fit();
</script>
</html>
